name: Self-Hosted Deployment

on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    runs-on: [self-hosted, arbor-education]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment Context
        # This step decides which Port and which Secret to use based on the branch
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "ENV_TAG=production" >> $GITHUB_ENV
            echo "PORT=3000" >> $GITHUB_ENV
            echo "RAW_SECRET=${{ secrets.PROD_SECRET }}" >> $GITHUB_ENV
          else
            echo "ENV_TAG=development" >> $GITHUB_ENV
            echo "PORT=3001" >> $GITHUB_ENV
            echo "RAW_SECRET=${{ secrets.DEV_SECRET }}" >> $GITHUB_ENV
          fi

      - name: Create .env file from Secrets
        # This takes the text from GitHub Secrets and writes it to a file
        run: |
          echo "$RAW_SECRET" > .env
          echo "PORT=${{ env.PORT }}" >> .env

      - name: Build and Run with Docker Compose
        run: |
          # Docker Compose automatically looks for the .env file in the current folder
          docker compose up -d --build --remove-orphans
      - name: Slack Notify
        if: always()
        run: |
          # Set variables based on job status
          if [[ "${{ job.status }}" == "success" ]]; then
            COLOR="#2EB67D"
            ICON="✅"
            STATUS="Success"
          else
            COLOR="#E01E5A"
            ICON="❌"
            STATUS="Failed"
          fi
          # Construct the JSON payload
          curl -X POST -H 'Content-type: application/json' \
          --data '{
            "attachments": [
              {
                "color": "'"$COLOR"'",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "'"$ICON"' *Deployment '"$STATUS"'* | *Build:* #${{ github.run_number }}"
                    }
                  },
                  {
                    "type": "divider"
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "📂 *Repository:* ${{ github.repository }}\n🌿 *Branch:* `${{ github.ref_name }}`\n👤 *Actor:* ${{ github.actor }}\n⚙️ *Event:* `${{ github.event_name }}`"
                    }
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": { "type": "plain_text", "text": "🔍 View Logs" },
                        "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      }
                    ]
                  }
                ]
              }
            ]
          }' ${{ secrets.SLACK_WEBHOOK }}
          

      - name: Post-build Cleanup
        # Important for self-hosted: don't leave the .env file sitting on the server
        if: always()
        run: |
          rm -f .env
          docker image prune -f
